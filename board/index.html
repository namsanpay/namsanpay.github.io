<section class="wrap page-head">
  <h1>칼럼·업무사례</h1>
  <p>급여·4대보험 실무에서 자주 묻는 내용과 노무법인 남산이 처리한 사례를 정리합니다.</p>
</section>

<section class="wrap section-last">
  <div class="tabs" role="group" aria-label="분류">
    <button type="button" class="tab" aria-pressed="true" data-cat="">전체</button>
    <button type="button" class="tab" aria-pressed="false" data-cat="급여 실무">급여 실무</button><button type="button" class="tab" aria-pressed="false" data-cat="4대보험">4대보험</button><button type="button" class="tab" aria-pressed="false" data-cat="업무사례">업무사례</button><button type="button" class="tab" aria-pressed="false" data-cat="공지">공지</button>
  </div>
  <ul class="post-list">
    
    <li data-cat="공지">
      <a href="/board/opening-notice/">
        <span class="cat">공지</span>
        <span class="post-title">급여·4대보험 아웃소싱 안내 페이지를 열었습니다</span>
        <time datetime="2026-11-23T00:00:00.000Z">2026.11.23</time>
      </a>
    </li>
    
  </ul>
  <p class="empty" hidden>등록된 글이 없습니다.</p>
</section>

<script>
(() => {
  const tabs = document.querySelectorAll('.tab');
  const items = document.querySelectorAll('.post-list li');
  const empty = document.querySelector('.empty');
  function apply(cat) {
    let n = 0;
    items.forEach((li) => { const show = !cat || li.dataset.cat === cat; li.hidden = !show; if (show) n++; });
    empty.hidden = n > 0;
    tabs.forEach((t) => t.setAttribute('aria-pressed', String(t.dataset.cat === cat)));
  }
  tabs.forEach((t) => t.addEventListener('click', () => {
    const cat = t.dataset.cat;
    history.replaceState(null, '', cat ? '?cat=' + encodeURIComponent(cat) : location.pathname);
    apply(cat);
  }));
  const q = new URLSearchParams(location.search).get('cat');
  if (q) apply(q);
})();
</script>
